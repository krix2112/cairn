                      {/* X Labels */}
                      <text x="50" y="218" fill="var(--c-bone-dim)" fontSize="10" textAnchor="middle" fontFamily="monospace">5.0</text>
                      <text x="205" y="218" fill="var(--c-bone-dim)" fontSize="10" textAnchor="middle" fontFamily="monospace">6.0</text>
                      <text x="360" y="218" fill="var(--c-bone-dim)" fontSize="10" textAnchor="middle" fontFamily="monospace">7.0</text>
                      <text x="515" y="218" fill="var(--c-bone-dim)" fontSize="10" textAnchor="middle" fontFamily="monospace">8.0</text>
                      <text x="670" y="218" fill="var(--c-bone-dim)" fontSize="10" textAnchor="middle" fontFamily="monospace">9.0</text>
                      <text x="360" y="234" fill="var(--c-bone-secondary)" fontSize="11" textAnchor="middle">Company Hiring Bar (Mean Required Level)</text>

                      {/* Scatter Dots */}

                            cx={cx}
                            cy={cy}
                            r={hoveredScatterDot?.company_id === c.company_id ? 6 : 3.5}

                            onMouseEnter={() => setHoveredScatterDot(c)}
                            onMouseLeave={() => setHoveredScatterDot(null)}
                          />
                        );

                    </svg>

                    {/* Scatter Hover Tooltip Overlay */}
                    {hoveredScatterDot && (
                      <div style={{ position: "absolute", top: 12, right: 12, background: "rgba(7, 11, 20, 0.95)", border: "1px solid var(--c-hairline)", borderRadius: 6, padding: "8px 12px", pointerEvents: "none", fontSize: 12 }}>

                        <div style={{ display: "flex", gap: 10, marginTop: 4, fontFamily: "var(--font-mono)" }}>
                          <span>Score: <strong style={{ color: hoveredScatterDot.category === "Safe" ? "#9BFF8A" : hoveredScatterDot.category === "Target" ? "#FFC46B" : "#FF7A3D" }}>{hoveredScatterDot.score}</strong></span>

                    <button

                      className={`fit-filter-btn ${fitFilter === "safe" ? "active" : ""}`}
                      onClick={() => setFitFilter("safe")}
                    >
                      Safe · ≥75 ({safeCount})
                    </button>
                    <button
                      type="button"
                      className={`fit-filter-btn ${fitFilter === "target" ? "active" : ""}`}
                      onClick={() => setFitFilter("target")}
                    >
                      Target · 50–74 ({targetCount})
                    </button>
                    <button
                      type="button"
                      className={`fit-filter-btn ${fitFilter === "reach" ? "active" : ""}`}
                      onClick={() => setFitFilter("reach")}
                    >
                      Reach · &lt;50 ({reachCount})
                    </button>
                  </div>

                  <input
                    type="search"
                    className="fit-search-input"
                    placeholder="Search 113 companies..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>

                {/* Ranked List Table */}
                <div className="fit-table-wrap">
                  <table className="tool-table">
                    <thead>
                      <tr>
                        <th style={{ width: 40, textAlign: "center" }}>#</th>

                        <th style={{ textAlign: "center" }}>Fit Tier</th>
                        <th style={{ textAlign: "center" }}>Readiness Score</th>
                        <th style={{ textAlign: "center" }}>Company Bar</th>

                      </tr>
                    </thead>
                    <tbody>
                      {filteredCompanies.map((c, idx) => (
                        <tr key={c.company_id}>
                          <td className="mono-num" style={{ textAlign: "center", color: "var(--c-bone-dim)" }}>{idx + 1}</td>
                          <td>
                            <strong style={{ color: "var(--c-bone)" }}>{c.name}</strong>

                          <td style={{ textAlign: "center" }}>
                            <span className={c.category === "Safe" ? "badge-safe" : c.category === "Target" ? "badge-target" : "badge-reach"}>
                              {c.category}

                          </td>

                  </h3>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 12 }}>
                    {(Array.isArray(rolesData) ? rolesData : (rolesData?.roles || [])).map(r => (

                      <span>50 (Target threshold)</span>
                      <span>75 (Safe threshold)</span>
                      <span>95 (Summit mastery)</span>
                    </div>
                  </div>
                </div>

                {/* SVG Projected Score Curve */}
                <div style={{ background: "rgba(9, 14, 26, 0.8)", border: "1px solid var(--c-hairline)", borderRadius: 8, padding: 12, margin: "18px 0" }}>
                  <div style={{ fontSize: 12, color: "var(--c-bone-dim)", marginBottom: 6 }}>Projected Score Growth Over Weeks</div>
                  <svg viewBox="0 0 700 160" style={{ width: "100%", height: 160 }}>
                    {/* Target line */}
                    <line x1="45" y1="35" x2="670" y2="35" stroke="rgba(155, 255, 138, 0.4)" strokeDasharray="3 3" />
                    <text x="50" y="30" fill="#9BFF8A" fontSize="9" fontFamily="monospace">TARGET: {targetScore}</text>

                    {/* Baseline */}
                    <line x1="45" y1="135" x2="670" y2="135" stroke="var(--c-hairline)" />

                    {/* Build Polyline points from score_curve */}
                    {planData?.score_curve && planData.score_curve.length > 0 && (() => {
                      const pts = planData.score_curve;
                      const maxW = Math.max(1, pts[pts.length - 1].week);
                      const pointsStr = pts.map(p => {
                        const px = 45 + (p.week / maxW) * 620;
                        const py = 135 - ((p.score - (planData.initial_score || 0)) / Math.max(1, targetScore - (planData.initial_score || 0) + 10)) * 100;
                        return `${px},${py}`;
                      }).join(" ");

                      return (
                        <g>
                          <polyline
                            fill="none"
                            stroke="#FF7A3D"
                            strokeWidth="2.5"
                            points={pointsStr}
                          />
                          {pts.map((p, pIdx) => {
                            const px = 45 + (p.week / maxW) * 620;
                            const py = 135 - ((p.score - (planData.initial_score || 0)) / Math.max(1, targetScore - (planData.initial_score || 0) + 10)) * 100;
                            return (
                              <circle key={pIdx} cx={px} cy={py} r="3" fill="#2EE6C5" />
                            );
                          })}
                        </g>
                      );
                    })()}

                    <text x="45" y="152" fill="var(--c-bone-dim)" fontSize="10" fontFamily="monospace">Week 0 (Score {planData?.initial_score || 0})</text>
                    <text x="670" y="152" fill="var(--c-bone-dim)" fontSize="10" textAnchor="end" fontFamily="monospace">Week {planData?.weeks_needed || 12} (Score {targetScore})</text>
                  </svg>
                </div>

                {/* Week-by-Week Milestone List */}
                <div style={{ marginTop: 20 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 600, color: "var(--c-bone)", marginBottom: 10 }}>
                    Step-by-Step Weekly Milestones
                  </h3>
                  <div className="planner-milestone-list">
                    {(planData?.milestones || []).map((m, mIdx) => (
                      <div key={mIdx} className="planner-milestone-item">
                        <span className="mono-num" style={{ color: "#2EE6C5", fontWeight: 700 }}>Week {m.week}</span>
                        <div>
                          <a href={m.waypoint_url || `#/skill/${m.area_code}`} style={{ color: "var(--c-bone)", textDecoration: "underline" }}>
                            {m.area_name}
                          </a>
                          <span className="mono-num" style={{ fontSize: 11, color: "var(--c-bone-dim)", marginLeft: 6 }}>
                            +{m.levels_gained} level{m.levels_gained > 1 ? "s" : ""}
                          </span>
                        </div>
                        <span className="mono-num" style={{ color: "var(--c-bone-secondary)" }}>{m.hours} hrs</span>
                        <span className="mono-num" style={{ color: "var(--c-lichen)", fontWeight: 600, textAlign: "right" }}>→ {m.projected_score}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Collapsible Assumptions Note */}
                <details style={{ marginTop: 18, background: "rgba(10, 15, 24, 0.4)", border: "1px solid var(--c-hairline)", borderRadius: 6, padding: "10px 14px", cursor: "pointer" }}>
                  <summary style={{ fontSize: 12, color: "var(--c-bone-secondary)", fontWeight: 500, outline: "none" }}>
                    Assumptions and Methodology Details
                  </summary>
                  <p style={{ fontSize: 12, color: "var(--c-bone-dim)", marginTop: 8, lineHeight: 1.5 }}>
                    Hours per level gained: 8 for COD, DSA, OOD, SQL; 6 for COMM, APTI, SWE; 10 for SYSD, CLOUD, AI, NETW, OS (defined in config.py as HOURS_PER_LEVEL). The planner applies greedy weekly allocation to prioritize skills offering the highest point gain per hour worked. All projections are heuristic estimates.
                  </p>
                </details>
              </section>

              {/* 4. CONFIDENCE BAND */}
              <section className="tool-panel" style={{ padding: 24 }}>
                <h2 className="tool-panel-title" style={{ fontSize: 18 }}>4. Resume Evidence Confidence Band</h2>
                <p className="tool-panel-sub">
                  Range of readiness scores depending on optimistic, base, or conservative interpretation of resume signals.
                </p>

                {/* Range Bar */}
                <div style={{ margin: "28px 0 36px" }}>
                  <div className="confidence-band-bar">
                    {bandData && (() => {
                      const p = bandData.pessimistic ?? bandData.pessimistic_score ?? 49;
                      const b = bandData.base ?? bandData.base_score ?? 62;
                      const o = bandData.optimistic ?? bandData.optimistic_score ?? 70;
                      const left = p;
                      const width = Math.max(4, o - p);

                      return (
                        <>
                          <div className="confidence-range-fill" style={{ left: `${left}%`, width: `${width}%` }} />
                          {/* Pessimistic Pin */}
                          <div className="confidence-pin" style={{ left: `${p}%` }} />
                          <div className="confidence-pin-label" style={{ left: `${p}%` }}>
                            Pessimistic: {p}
                          </div>

                          {/* Base Pin */}
                          <div className="confidence-pin" style={{ left: `${b}%`, background: "#2EE6C5", boxShadow: "0 0 6px #2EE6C5" }} />
                          <div className="confidence-pin-label" style={{ left: `${b}%`, color: "#2EE6C5", fontWeight: 700 }}>
                            Base: {b}
                          </div>

                          {/* Optimistic Pin */}
                          <div className="confidence-pin" style={{ left: `${o}%` }} />
                          <div className="confidence-pin-label" style={{ left: `${o}%` }}>
                            Optimistic: {o}
                          </div>
                        </>
                      );
                    })()}
                  </div>
                </div>

                <div style={{ background: "rgba(10, 15, 24, 0.6)", border: "1px solid var(--c-hairline)", borderRadius: 6, padding: "12px 16px", fontSize: 13, color: "var(--c-bone)" }}>
                  <strong style={{ color: "var(--c-bone)" }}>{bandData?.summary || bandData?.interpretation_sentence || "Your score is 49–70 depending on how the resume evidence is read."}</strong>
                  <p style={{ color: "var(--c-bone-secondary)", fontSize: 12, marginTop: 4 }}>
                    Pessimistic scoring counts only strict, verified evidence (points: high 2, med 1, low 0). Optimistic scoring gives full credit for indirect project mentions (points: high 4, med 3, low 2).
                  </p>
                </div>
              </section>

              {/* 5. EVIDENCE COVERAGE */}
              <section className="tool-panel" style={{ padding: 24 }}>
                <h2 className="tool-panel-title" style={{ fontSize: 18 }}>5. Resume Evidence Coverage by Competency</h2>
                <p className="tool-panel-sub">
                  Stacked distribution of high, medium, and low-confidence resume extractions across all 12 areas.
                </p>

                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 12, marginTop: 16 }}>
                  {window.CAIRN_ORDER.map(code => {
                    const counts = evidenceCounts[code] || { high: 0, med: 0, low: 0, total: 0 };
                    const meta = window.SKILL_METADATA?.[code] || { name: code };
                    const isZero = counts.total === 0;

                    return (
                      <div key={code} style={{ background: "rgba(10, 15, 24, 0.6)", border: "1px solid var(--c-hairline)", borderRadius: 6, padding: "10px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                          <div>
                            <strong style={{ color: "var(--c-bone)", fontSize: 13 }}>{meta.name}</strong>
                            <span className="mono-num" style={{ fontSize: 11, color: "var(--c-bone-dim)", marginLeft: 6 }}>{code}</span>
                          </div>
                          {isZero ? (
                            <span style={{ fontSize: 10, background: "rgba(255, 122, 61, 0.2)", color: "#FF7A3D", border: "1px solid rgba(255, 122, 61, 0.4)", borderRadius: 3, padding: "1px 6px", fontWeight: 600 }}>
                              No direct evidence
                            </span>
                          ) : (
                            <span className="mono-num" style={{ fontSize: 11, color: "var(--c-bone-secondary)" }}>
                              {counts.total} mention{counts.total > 1 ? "s" : ""}
                            </span>
                          )}
                        </div>

                        {/* Stacked bar */}
                        <div style={{ height: 8, background: "rgba(255, 255, 255, 0.06)", borderRadius: 4, display: "flex", overflow: "hidden" }}>
                          {counts.high > 0 && (
                            <div style={{ width: `${(counts.high / Math.max(1, counts.total)) * 100}%`, background: "var(--c-lichen)" }} title={`High confidence: ${counts.high}`} />
                          )}
                          {counts.med > 0 && (
                            <div style={{ width: `${(counts.med / Math.max(1, counts.total)) * 100}%`, background: "#FFC46B" }} title={`Medium confidence: ${counts.med}`} />
                          )}
                          {counts.low > 0 && (
                            <div style={{ width: `${(counts.low / Math.max(1, counts.total)) * 100}%`, background: "#FF7A3D" }} title={`Low confidence: ${counts.low}`} />
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

            </div>
          )}
        </div>
      );
    }

    // ——— COMMAND PALETTE MODAL (⌘K) ———
    function CommandPaletteModal({ onClose, companies, store, updateStore, onSampleWorkflow, onOpenHeatmap, samplesMeta }) {
      const [query, setQuery] = useState("");
      const [activeIndex, setActiveIndex] = useState(0);

      const items = useMemo(() => {
        const q = query.toLowerCase().trim();
        const base = [
          { type: "Nav", label: "Go to Job Description", action: () => { window.location.hash = "#/job"; onClose(); } },
          { type: "Nav", label: "Go to Candidate Resume", action: () => { window.location.hash = "#/resume"; onClose(); } },
          { type: "Nav", label: "Go to Candidate Profile", action: () => { window.location.hash = "#/profile"; onClose(); } },
          { type: "Nav", label: "Go to Readiness Check", action: () => { window.location.hash = "#/check"; onClose(); } },
          { type: "Nav", label: "Go to Skill Match & Gaps", action: () => { window.location.hash = "#/match"; onClose(); } },
          { type: "Nav", label: "Open Printable A4 Report", action: () => { window.location.hash = "#/report"; onClose(); } },
          { type: "Nav", label: "Open Skill Map (All 12 Waypoints)", action: () => { window.location.hash = "#/skills"; onClose(); } },
          { type: "Nav", label: "Open Insights & Fit Finder (#/insights)", action: () => { window.location.hash = "#/insights"; onClose(); } },
          { type: "Nav", label: "Open Growth Roadmap Planner", action: () => { window.location.hash = "#/insights"; onClose(); } },
          { type: "Action", label: "Compare All 4 Candidates (Heatmap)", action: onOpenHeatmap },
          { type: "Target", label: "Switch Target to Google", action: () => { updateStore({ companyId: 4 }); onClose(); } },
          { type: "Target", label: "Switch Target to Microsoft", action: () => { updateStore({ companyId: 78 }); onClose(); } },
          { type: "Target", label: "Switch Target to Oracle FSS", action: () => { updateStore({ companyId: 24 }); onClose(); } },
        ];

        // Dynamic Sample Candidates from /samples/meta
        (samplesMeta?.resumes || []).forEach(c => {
          let targetJd = "google_swe";
          let compId = 4;
          if (c.name === "ananya_rao") { targetJd = "microsoft_swe"; compId = 78; }
          else if (c.name === "karthik_subramaniam") { targetJd = "google_ds"; compId = 4; }
          else if (c.name === "priya_menon") { targetJd = "oracle_ase"; compId = 24; }
          
          const jd = (samplesMeta?.jds || []).find(j => j.name === targetJd);
          const jdLabel = jd ? `${jd.company} ${jd.role}` : targetJd;

          base.push({
            type: "Sample",
            label: `Load Candidate: ${c.full_name} (${jdLabel})`,
            action: () => { onSampleWorkflow(c.name, targetJd, compId); onClose(); }
          });
        });

        // Add 12 Skill Waypoints
        window.CAIRN_ORDER.forEach(code => {
          const meta = window.SKILL_METADATA?.[code] || { name: code };
          base.push({
            type: "Waypoint",
            label: `Waypoint ${code}: ${meta.name}`,
            action: () => { window.location.hash = `#/skill/${code}`; onClose(); }
          });
        });

        if (!q) return base;
        return base.filter(item => item.label.toLowerCase().includes(q) || item.type.toLowerCase().includes(q));
      }, [query, companies, samplesMeta]);

      const handleKeyDown = (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          setActiveIndex(prev => (prev + 1) % items.length);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          setActiveIndex(prev => (prev - 1 + items.length) % items.length);
        } else if (e.key === "Enter" && items[activeIndex]) {
          e.preventDefault();
          items[activeIndex].action();
        }
      };

      return (
        <div className="cmd-modal-backdrop" onClick={onClose}>
          <div className="cmd-modal" onClick={(e) => e.stopPropagation()}>
            <div className="cmd-input-wrapper">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                type="text"
                className="cmd-search-input"
                placeholder="Type a step, candidate, company, or waypoint..."
                value={query}
                onChange={(e) => { setQuery(e.target.value); setActiveIndex(0); }}
                onKeyDown={handleKeyDown}
                autoFocus
              />
              <span className="mono-num" style={{ fontSize: 11, color: "var(--c-bone-dim)" }}>ESC to exit</span>
            </div>

            <div className="cmd-list">
              {items.map((item, idx) => (
                <div
                  key={idx}
                  className={`cmd-item ${idx === activeIndex ? "active" : ""}`}
                  onClick={item.action}
                  onMouseEnter={() => setActiveIndex(idx)}
                >
                  <span>{item.label}</span>
                  <span className="cmd-item-badge">{item.type}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ——— CANDIDATE HEATMAP COMPARISON MODAL ———
    function CandidateHeatmapModal({ onClose, currentCompanyId, companies, samplesMeta }) {
      const [matrix, setMatrix] = useState([]);
      const [loading, setLoading] = useState(true);
      const [sortCol, setSortCol] = useState("score");
      const [sortAsc, setSortAsc] = useState(false);

      useEffect(() => {
        let mounted = true;
        async function fetchAll() {
          setLoading(true);
          const results = [];
          let candidates = samplesMeta?.resumes;
          if (!candidates || candidates.length === 0) {
            try {
              const metaRes = await api("/samples/meta");
              candidates = metaRes.resumes || [];
            } catch (_) {
              candidates = [];
            }
          }
          for (const cand of candidates) {
            try {
              const res = await postJson("/samples/analyze", { kind: "resume", name: cand.name });
              const prefill = { ...res.prefill, email: cand.email };
              await postJson("/profile", prefill);
              const tc = await postJson("/talent-check", { email: cand.email, company_id: currentCompanyId });
              
              const levels = {};
              tc.skillset_gap.forEach(g => { levels[g.category_code] = g.candidate_level; });

              results.push({
                id: cand.name,
                name: cand.full_name,
                headline: cand.headline,
                score: tc.readiness_score,
                levels
              });
            } catch (err) {
              console.error("Heatmap load error for", cand.name, err);
            }
          }
          if (mounted) {
            setMatrix(results);
            setLoading(false);
          }
        }
        fetchAll();
        return () => { mounted = false; };
      }, [currentCompanyId, samplesMeta]);

      const handleSort = (col) => {
        if (sortCol === col) {
          setSortAsc(!sortAsc);
        } else {
          setSortCol(col);
          setSortAsc(false);
        }
      };

      const sortedMatrix = useMemo(() => {
        return [...matrix].sort((a, b) => {
          let va = sortCol === "score" ? a.score : (a.levels[sortCol] || 0);
          let vb = sortCol === "score" ? b.score : (b.levels[sortCol] || 0);
          return sortAsc ? va - vb : vb - va;
        });
      }, [matrix, sortCol, sortAsc]);

      // Diverging color scale: coral-tint (<5) to lichen-tint (>=8)
      const getCellColor = (lvl) => {
        if (lvl == null) return "rgba(243, 238, 228, 0.04)";
        if (lvl >= 8) return "rgba(155, 197, 61, 0.28)";
        if (lvl >= 6) return "rgba(155, 197, 61, 0.12)";
        if (lvl >= 4) return "rgba(232, 137, 90, 0.15)";
        return "rgba(255, 122, 61, 0.25)";
      };

      return (
        <div className="heatmap-modal-backdrop" onClick={onClose}>
          <div className="heatmap-modal" onClick={(e) => e.stopPropagation()}>
            <div className="heatmap-modal-header">
              <div>
                <h2 style={{ fontSize: 18, color: "var(--c-bone)", fontWeight: 500 }}>
                  Candidate Competency Heatmap — {companies[currentCompanyId]}
                </h2>
                <p style={{ fontSize: 13, color: "var(--c-bone-secondary)", margin: "4px 0 0" }}>
                  4 candidates × 12 skill areas · Diverging coral-to-lichen scale · Click columns to sort
                </p>
              </div>
              <button type="button" className="drawer-close-btn" onClick={onClose}>✕</button>
            </div>

            <div className="heatmap-modal-body">
              {loading ? (
                <div style={{ padding: 40, textAlign: "center", color: "var(--c-bone-dim)" }}>
                  <div className="skeleton-row"></div>
                  <div className="skeleton-row"></div>
                  <div className="skeleton-row"></div>
                </div>
              ) : (
                <table className="tool-table">
                  <thead>
                    <tr>
                      <th style={{ minWidth: 160 }}>Candidate</th>
                      <th
                        style={{ cursor: "pointer", textAlign: "center" }}
                        onClick={() => handleSort("score")}
                      >
                        Score {sortCol === "score" ? (sortAsc ? "▲" : "▼") : ""}
                      </th>
                      {window.CAIRN_ORDER.map(c => (
                        <th
                          key={c}
                          style={{ cursor: "pointer", textAlign: "center" }}
                          onClick={() => handleSort(c)}
                        >
                          {c} {sortCol === c ? (sortAsc ? "▲" : "▼") : ""}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {sortedMatrix.map(c => (
                      <tr key={c.id}>
                        <td>
                          <strong style={{ color: "var(--c-bone)", display: "block" }}>{c.name}</strong>
                          <span style={{ fontSize: 11, color: "var(--c-bone-dim)" }}>{c.headline}</span>
                        </td>
                        <td className="mono-num" style={{ textAlign: "center", fontSize: 15, fontWeight: 600, color: c.score >= 75 ? "var(--c-lichen)" : c.score >= 50 ? "#E8895A" : "var(--c-ember)" }}>
                          {c.score}
                        </td>
                        {window.CAIRN_ORDER.map(code => {
                          const lvl = c.levels[code];
                          return (
                            <td
                              key={code}
                              className="heatmap-cell"
                              style={{ backgroundColor: getCellColor(lvl) }}
                            >
                              {lvl != null ? lvl : "--"}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render React Application Root
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Cairn</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='7' y='3' width='10' height='4.5' rx='2.25' fill='%232563EB'/%3E%3Crect x='4' y='9.5' width='16' height='5' rx='2.5' fill='%230F172A'/%3E%3Crect x='2' y='16.5' width='20' height='5.5' rx='2.75' fill='%230F172A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root {
      --bg: #F7F8FA;
      --card-bg: #FFFFFF;
      --border: #E4E7EC;
      --border-dark: #D0D5DD;
      --text: #0F172A;
      --text-secondary: #475467;
      --text-muted: #667085;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --status-green: #067647;
      --status-green-bg: #ECFDF3;
      --status-green-border: #A6F4C5;
      --status-red: #B42318;
      --status-red-bg: #FEF3F2;
      --status-red-border: #FECDCA;
      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-name {
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.02em;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px 32px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    input[type="email"] {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--text);
      background: #FFFFFF;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      outline: none;
      transition: border-color 150ms ease-in-out, box-shadow 150ms ease-in-out;
    }

    input[type="email"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn {
      width: 100%;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 150ms ease-in-out, border-color 150ms ease-in-out;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert {
      display: none;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .alert-success {
      background: var(--status-green-bg);
      border: 1px solid var(--status-green-border);
      color: var(--status-green);
    }

    .alert-error {
      background: var(--status-red-bg);
      border: 1px solid var(--status-red-border);
      color: var(--status-red);
    }

    .footer-nav {
      margin-top: 24px;
      text-align: center;
    }

    .footer-link {
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 150ms ease-in-out;
    }

    .footer-link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="index.html" class="brand-header">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="7" y="3" width="10" height="4.5" rx="2.25" fill="#2563EB"/>
        <rect x="4" y="9.5" width="16" height="5" rx="2.5" fill="#0F172A"/>
        <rect x="2" y="16.5" width="20" height="5.5" rx="2.75" fill="#0F172A"/>
      </svg>
      <span class="brand-name">Cairn</span>
    </a>

    <div class="card">
      <h1>Sign in to Cairn</h1>
      <p class="subtitle">Save your resumes and track applications across visits.</p>

      <div id="alert-box" class="alert" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Work or personal email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary">Send magic link</button>
      </form>
    </div>

    <div class="footer-nav">
      <a href="index.html" id="guest-link" class="footer-link">Continue as guest &rarr;</a>
    </div>
  </div>

  <script src="vendor/supabase.min.js"></script>
  <script>
    let supabaseClient = null;
    const urlParams = new URLSearchParams(window.location.search);
    const returnTarget = urlParams.get('return') || 'dashboard.html';
    document.getElementById('guest-link').href = urlParams.get('return') || 'index.html';

    const alertBox = document.getElementById('alert-box');
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('btn-submit');
    const emailInput = document.getElementById('email');

    function showAlert(msg, isSuccess) {
      alertBox.textContent = msg;
      alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'block';
    }

    async function initSupabase() {
      try {
        const resp = await fetch('/config');
        const config = await resp.json();
        if (config.supabase_url && config.supabase_publishable_key && window.supabase) {
          supabaseClient = window.supabase.createClient(config.supabase_url, config.supabase_publishable_key);

          // Check existing session
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) {
            window.location.href = returnTarget;
            return;
          }

          // Handle magic link auth callback hash (#access_token=...)
          supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
              window.location.href = returnTarget;
            }
          });
        }
      } catch (err) {
        console.warn('Supabase initialization failed:', err);
      }
    }

    initSupabase();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending link...';
      alertBox.style.display = 'none';

      if (!supabaseClient) {
        // Fallback for local development if Supabase credentials are not configured
        showAlert('Development mode: Supabase credentials not configured in environment. You can use guest mode or configure .env.', false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send magic link';
        return;
      }

      try {
        const redirectUrl = window.location.origin + '/' + returnTarget;
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: email,
          options: {
            emailRedirectTo: redirectUrl
          }
        });

        if (error) {
          showAlert(error.message || 'Unable to send magic link. Please check your email.', false);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send magic link';
        } else {
          showAlert('Check your email. We sent you a sign-in link.', true);
          submitBtn.textContent = 'Link sent';
          emailInput.disabled = true;
        }
      } catch (err) {
        showAlert('Network error sending magic link. Please try again.', false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send magic link';
      }
    });
  </script>
</body>
</html>
